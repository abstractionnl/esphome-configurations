substitutions:
  device_name: wican-ioniq
  friendly_name: "Wican Ioniq"

packages:
  common: !include common/common.yaml
  wican: !include common/wican.yaml

obd:
  pids:
    - can_id: 0x7E4
      pid: 0x2101
      id: bms_1
      reply_length: 72
    - can_id: 0x7E4
      pid: 0x2105
      id: bms_5
      reply_length: 56
    - can_id: 0x7c6
      pid: 0x22b002
      interval: 30s
      id: odo
      reply_length: 16
    - can_id: 0x7e6
      pid: 0x2180
      interval: 30s
      id: vmcu
      reply_length: 16
    - can_id: 0x7a0
      pid: 0x22c00b
      interval: 30s
      id: tpms
      reply_length: 24
    - can_id: 0x770
      pid: 0x22bc04
      interval: 30s
      wake: true
      slow_interval: 1800s
      id: igmp
      reply_length: 16

button:
  - platform: template
    id: open_charge_port
    name: "Open charge port"
    on_press:
      # tester present
      - canbus.send:
          can_id: 0x7a0
          data: [ 0x01, 0x3e, 0xAA, 0xAA, 0xAA, 0xAA, 0xAA, 0xAA ]
      - delay: 50ms
      # change session
      - canbus.send:
          can_id: 0x7a0
          data: [ 0x02, 0x10, 0x03, 0xAA, 0xAA, 0xAA, 0xAA, 0xAA ]
      # wait for response ... somehow
      - delay: 0.5s
      # open the port
      - canbus.send:
          can_id: 0x7a0
          data: [ 0x04, 0x2f, 0xb0, 0x61, 0x03, 0xAA, 0xAA, 0xAA ]
      - delay: 50ms
      # change back to default session
      - canbus.send:
          can_id: 0x7a0
          data: [ 0x02, 0x10, 0x01, 0x61, 0x03, 0xAA, 0xAA, 0xAA ]

sensor:
  - platform: obd
    pid_id: bms_1
    index: 9
    filters:
      - multiply: 0.5
    id: soc_bms
    name: 'Battery BMS'
    unit_of_measurement: '%'
    accuracy_decimals: 1
    device_class: battery
    state_class: measurement
  - platform: obd
    pid_id: bms_1
    index: [ 15, 17 ]
    signed: true
    filters:
      - multiply: 0.1
    id: hv_battery_current
    name: 'HV Battery Current'
    unit_of_measurement: 'A'
    accuracy_decimals: 1
    device_class: current
    state_class: measurement
    on_value:
      then:
        component.update: energy_draw    
  - platform: obd
    pid_id: bms_1
    index: [ 18, 19 ]
    filters:
      - multiply: 0.1
    id: hv_battery_voltage
    name: 'HV Battery Voltage'
    unit_of_measurement: 'V'
    accuracy_decimals: 1
    device_class: voltage
    state_class: measurement
  - platform: obd
    pid_id: bms_1
    index: [47, 49, 50, 51]
    filters:
      - multiply: 0.1
    id: cec
    name: 'Cumulative Energy Charged'
    unit_of_measurement: 'kWh'
    accuracy_decimals: 1
    device_class: energy
    state_class: total_increasing
  - platform: obd
    pid_id: bms_1
    index: [52, 53, 54, 55]
    filters:
      - multiply: 0.1
    id: ced
    name: 'Cumulative Energy Discharged'
    unit_of_measurement: 'kWh'
    accuracy_decimals: 1
    device_class: energy
    state_class: total_increasing
  - platform: obd
    pid_id: bms_5
    index: [33, 34]
    filters:
      - multiply: 0.1
    id: soh
    name: 'State of Health'
    unit_of_measurement: '%'
    accuracy_decimals: 1
    state_class: measurement
  - platform: obd
    pid_id: bms_1
    index: 21
    signed: true
    id: battery_min_temp
    name: 'Battery Min Temperature'
    unit_of_measurement: '°C'
    accuracy_decimals: 0
    device_class: temperature
    state_class: measurement
  - platform: obd
    pid_id: bms_1
    index: 20
    signed: true
    id: battery_max_temp
    name: 'Battery Max Temperature'
    unit_of_measurement: '°C'
    accuracy_decimals: 0
    device_class: temperature
    state_class: measurement
  - platform: obd
    pid_id: vmcu
    index: 18
    filters:
      - offset: -80
      - multiply: 0.5
    id: ambient_temp
    name: 'Ambient Temperature'
    unit_of_measurement: '°C'
    accuracy_decimals: 1
    device_class: temperature
    state_class: measurement
  - platform: obd
    pid_id: bms_5
    index: 39
    filters:
      - multiply: 0.5
    id: soc_display
    name: 'Battery'
    unit_of_measurement: '%'
    accuracy_decimals: 1
    device_class: battery
    state_class: measurement  
  - platform: obd
    pid_id: odo
    index: [12, 13, 14]
    id: odometer
    name: 'Odometer'
    unit_of_measurement: 'km'
    accuracy_decimals: 0    
    device_class: distance
    state_class: total_increasing
  - platform: obd
    pid_id: tpms
    index: 10
    filters:
      - multiply: 0.2
      - multiply: 0.0689476
    id: tpms_fl
    name: 'Tire Pressure Front Left'
    unit_of_measurement: 'bar'
    accuracy_decimals: 1    
    device_class: pressure
    state_class: measurement
  - platform: obd
    pid_id: tpms
    index: 14
    filters:
      - multiply: 0.2
      - multiply: 0.0689476
    id: tpms_fr
    name: 'Tire Pressure Front Right'
    unit_of_measurement: 'bar'
    accuracy_decimals: 1    
    device_class: pressure
    state_class: measurement
  - platform: obd
    pid_id: tpms
    index: 19
    filters:
      - multiply: 0.2
      - multiply: 0.0689476
    id: tpms_rl
    name: 'Tire Pressure Rear Left'
    unit_of_measurement: 'bar'
    accuracy_decimals: 1    
    device_class: pressure
    state_class: measurement
  - platform: obd
    pid_id: tpms
    index: 23
    filters:
      - multiply: 0.2
      - multiply: 0.0689476
    id: tpms_rr
    name: 'Tire Pressure Rear Right'
    unit_of_measurement: 'bar'
    accuracy_decimals: 1    
    device_class: pressure
    state_class: measurement
  - platform: template
    name: 'Energy Draw'
    id: energy_draw
    unit_of_measurement: 'kW'
    accuracy_decimals: 2    
    device_class: power
    state_class: measurement
    lambda: !lambda return (id(hv_battery_current).state * id(hv_battery_voltage).state)/1000;
    update_interval: never

binary_sensor:
  - platform: obd
    pid_id: bms_1
    index: 14
    mask: 0x20
    name: 'AC Charger connected'
    id: ac_charger_connected
    device_class: plug
  - platform: obd
    pid_id: bms_1
    index: 14
    mask: 0x40
    name: 'DC Charger connected'
    id: dc_charger_connected
    device_class: plug
  - platform: obd
    pid_id: bms_1
    index: 14
    mask: 0x80
    name: 'Charging'
    id: charging
    device_class: battery_charging
  - platform: obd
    pid_id: igmp
    index: 10
    mask: 0x0c
    name: 'Lock status'
    id: doors_locked
    device_class: lock
    filters:
      - invert