esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  fast_connect: True
  domain: ".lan"
  min_auth_mode: WPA2

# Enable Home Assistant API
api:
  encryption:
    key: !secret api_key

# Enable OTA updates
ota:
  - platform: esphome
    encryption:
      key: !secret api_key

# Restart buttons
button:
  - platform: restart
    id: reboot
    name: Restart
    entity_category: diagnostic
  - platform: safe_mode
    name: Safe Mode Boot
    entity_category: diagnostic

# Add some diagnostic sensors
sensor:
  - platform: uptime
    type: seconds
    name: Uptime
    entity_category: diagnostic
text_sensor:
  - platform: wifi_info
    ip_address:
      name: IP Address

# Enable logging
logger:
  baud_rate: 0

web_server:
  port: 80
  ota: false
  auth:
    type: digest
    username: !secret web_server_username
    password: !secret web_server_password
